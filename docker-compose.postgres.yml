# Postgres + pgvector for local / dev-server use when managed PostgreSQL
# (e.g. rcpgdb) is too old or does not ship the vector extension.
# Usage: docker compose -f docker-compose.postgres.yml up -d
# DATABASE_URL example (change password in both places):
#   postgresql://eduai:YOUR_PASSWORD@127.0.0.1:5433/deveduaidb?schema=public

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduai
      POSTGRES_PASSWORD: eduai_dev_change_me
      POSTGRES_DB: deveduaidb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - eduai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduai -d deveduaidb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eduai_pgdata:
