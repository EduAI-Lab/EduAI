name: PR Tests

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run Docker test suite
        run: npm run test:all

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Sanity check combobox.tsx
        run: |
          echo "Looking at combobox.tsx right after checkout..."
          grep -n "Popover" packages/ui/src/ui/combobox.tsx || echo "✅ No Popover found! The file is correct in Git."

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
