name: PR Tests

on:
  pull_request:
    branches: [development, main]
  # Required checks must run on GitHub's temporary merge-group commit before
  # an entry can leave the merge queue. Keep this limited to development,
  # which is the branch governed by the queue policy.
  merge_group:
    types: [checks_requested]
    branches: [development]
  push:
    branches: [development]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected applications
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      core: ${{ steps.filter.outputs.core }}
      ai_tutor: ${{ steps.filter.outputs.ai_tutor }}
      question_maker: ${{ steps.filter.outputs.question_maker }}
      shared: ${{ steps.filter.outputs.shared }}
      cross_service: ${{ steps.filter.outputs.cross_service }}
      unit_matrix: ${{ steps.filter.outputs.unit_matrix }}
    steps:
      - name: Classify changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The file list is matched from a file rather than piped from `echo`.
          # A large pull request (the oxfmt sweep changed 1482 files) overflows
          # the pipe buffer, and `grep -q` exits on its first match before the
          # write finishes, so `echo` dies of EPIPE and `pipefail` reports the
          # whole pipeline as failed — turning a match into a false condition
          # and silently skipping every gate below.
          changed=$RUNNER_TEMP/changed-files.txt
          all=false

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename' > "$changed"
          else
            all=true
            : > "$changed"
          fi
          echo "Changed files: $(wc -l < "$changed")"

          code=false
          core=false
          ai_tutor=false
          question_maker=false
          shared=false

          if [ "$all" = true ]; then
            code=true
            core=true
            ai_tutor=true
            question_maker=true
            shared=true
          # `docs/` holds executable JavaScript as well as prose (for example
          # docs/ux/chat-progress-1171/capture.mjs), so it is skippable only for
          # known documentation and asset extensions. Anything else under it —
          # including code — counts as a code change and runs the gates.
          elif grep -qvE '\.(md|txt)$|^docs/.*\.(md|txt|png|jpe?g|gif|svg|webp|pdf|csv)$|^LICENSE$' "$changed"; then
            code=true

            if grep -qE '^apps/core/' "$changed"; then
              core=true
            fi
            if grep -qE '^apps/extensions/ai-tutor/' "$changed"; then
              ai_tutor=true
            fi
            if grep -qE '^apps/extensions/question-maker/' "$changed"; then
              question_maker=true
            fi

            # Root build/test infrastructure and shared packages can affect every app.
            if grep -qE \
              '^packages/|^tests/|^scripts/|^docker/|^docker-compose|^package(-lock)?\.json$|^turbo\.json$|^\.github/workflows/pr-tests\.yml$' \
              "$changed"; then
              shared=true
              core=true
              ai_tutor=true
              question_maker=true
            fi

            # Unknown code paths are treated conservatively as shared.
            if [ "$core" = false ] && [ "$ai_tutor" = false ] && \
               [ "$question_maker" = false ] && [ "$shared" = false ]; then
              shared=true
              core=true
              ai_tutor=true
              question_maker=true
            fi
          fi

          cross_service=false
          # Cross-service specs exercise contracts from every application, so an
          # application-only change still needs the full stack.
          if [ "$core" = true ] || [ "$ai_tutor" = true ] || [ "$question_maker" = true ]; then
            cross_service=true
          fi

          {
            echo "code=$code"
            echo "core=$core"
            echo "ai_tutor=$ai_tutor"
            echo "question_maker=$question_maker"
            echo "shared=$shared"
            echo "cross_service=$cross_service"
          } >> "$GITHUB_OUTPUT"

          matrix='{"include":['
          separator=''
          if [ "$core" = true ]; then
            matrix+="${separator}"'{"scope":"core","label":"Core and shared UI","db_image":"pgvector/pgvector:pg16","db_user":"postgres","db_password":"postgres","db_name":"postgres"}'
            separator=','
          fi
          if [ "$ai_tutor" = true ]; then
            matrix+="${separator}"'{"scope":"ai_tutor","label":"AI Tutor","db_image":"postgres:16-alpine","db_user":"postgres","db_password":"postgres","db_name":"aitutor_test"}'
            separator=','
          fi
          if [ "$question_maker" = true ]; then
            matrix+="${separator}"'{"scope":"question_maker","label":"Question Maker","db_image":"postgres:15-alpine","db_user":"postgres","db_password":"password","db_name":"question_maker_test"}'
          fi
          matrix+=']}'
          echo "unit_matrix=$matrix" >> "$GITHUB_OUTPUT"

          {
            echo "### Affected applications"
            echo
            echo "| Core | AI Tutor | Question Maker | Cross-service |"
            echo "| --- | --- | --- | --- |"
            echo "| $core | $ai_tutor | $question_maker | $cross_service |"
          } >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: Unit tests — ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit_matrix) }}

    services:
      db:
        image: ${{ matrix.db_image }}
        env:
          POSTGRES_USER: ${{ matrix.db_user }}
          POSTGRES_PASSWORD: ${{ matrix.db_password }}
          POSTGRES_DB: ${{ matrix.db_name }}
        ports:
          # Core's test configuration assumes the database is on the default port.
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ matrix.db_user }}"
          --health-interval 5s --health-timeout 5s --health-retries 12
      core-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Start timing
        run: echo "CI_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        env:
          SKIP_PRISMA_GENERATE: "1"
        run: npm ci

      - name: Configure test environment
        run: |
          set -euo pipefail
          case "${{ matrix.scope }}" in
            core)
              rm -f apps/core/.env
              cat > apps/core/.env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public"
          REDIS_URL="redis://127.0.0.1:6379"
          BETTER_AUTH_SECRET="test-secret-not-for-production"
          BETTER_AUTH_URL="http://localhost:3000"
          COOKIE_DOMAIN="localhost"
          PORT=4001
          EOF
              ;;
            ai_tutor)
              cat > apps/extensions/ai-tutor/server/.env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/aitutor_test"
          BETTER_AUTH_SECRET="test-secret-not-for-production"
          BETTER_AUTH_URL="http://localhost:4000/api/auth"
          COOKIE_DOMAIN="localhost"
          PORT=4001
          EOF
              ;;
            question_maker)
              ;;
          esac

      - name: Generate Prisma client
        run: |
          set -euo pipefail
          case "${{ matrix.scope }}" in
            core)
              npm run db:generate -w edu-ai
              ;;
            ai_tutor)
              ( cd apps/extensions/ai-tutor/server && npx prisma generate )
              ;;
            question_maker)
              npm run db:generate -w question-maker-backend
              ;;
          esac

      - name: Restore Turborepo cache
        id: turbo-cache
        # Restore before testing, then save in a separate post-test step so a
        # failed run never publishes incomplete task artifacts.
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ matrix.scope }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ matrix.scope }}-

      - name: Run workspace tests
        env:
          NODE_ENV: test
          GOOGLE_GENERATIVE_AI_API_KEY: test-key-not-real
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: test-jwt-secret-for-ci
          ENCRYPTION_KEY: test-encryption-key-32bytes!!
        run: |
          case "${{ matrix.scope }}" in
            core)
              status=0
              npx turbo run test --continue --env-mode=loose \
                --filter=@eduai/ui &
              ui_pid=$!
              npx turbo run test:unit test:integration --continue --env-mode=loose \
                --filter=edu-ai &
              core_pid=$!
              wait "$ui_pid" || status=1
              wait "$core_pid" || status=1
              exit "$status"
              ;;
            ai_tutor)
              npx turbo run test --continue --env-mode=loose \
                --filter=ai-tutor --filter=ai-tutor-server
              ;;
            question_maker)
              export TEST_DATABASE_URL=postgresql://postgres:password@127.0.0.1:5432/question_maker_test
              npx turbo run test --continue --env-mode=loose \
                --filter=question-maker-frontend --filter=question-maker-backend
              ;;
          esac

      - name: Save Turborepo cache
        if: success() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

      - name: Write timing summary
        if: always()
        run: |
          started_at=${CI_JOB_STARTED:-$(date +%s)}
          elapsed=$(($(date +%s) - started_at))
          matched='${{ steps.turbo-cache.outputs.cache-matched-key }}'
          [ -n "$matched" ] || matched='none'
          {
            echo "### ${{ matrix.label }}"
            echo
            echo "- Job time: ${elapsed}s"
            echo "- Turbo cache matched: \`$matched\`"
            echo "- Exact cache hit: \`${{ steps.turbo-cache.outputs.cache-hit || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  prisma-isolation:
    name: Prisma Client Isolation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.ai_tutor == 'true' || needs.changes.outputs.question_maker == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        env:
          SKIP_PRISMA_GENERATE: "1"
        run: npm ci
      - name: Generate each client once
        run: |
          npm run db:generate -w edu-ai
          ( cd apps/extensions/ai-tutor/server && npx prisma generate )
          npm run db:generate -w question-maker-backend
      - run: npm run test:prisma-client-isolation

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        env:
          SKIP_PRISMA_GENERATE: "1"
        run: npm ci
      # Runs first because it is purely syntactic and takes well under a second:
      # a formatting failure reports in about the time `npm ci` takes rather than
      # after Prisma generate, lint and tsc.
      # Enforceable only now that the repo has actually been swept (#1512).
      # oxfmt is pinned to an exact version, so a transitive bump cannot change
      # the expected output out from under this gate.
      - name: Format check
        run: npm run format:check
      # The sweep commit recorded in .git-blame-ignore-revs has to keep resolving
      # — a rebase mints a new SHA and would silently strand the entry, leaving
      # `git blame` pointing every line at the sweep forever.
      - name: Validate blame-ignore revs
        run: |
          rc=0
          while read -r sha; do
            if git cat-file -e "$sha^{commit}" 2>/dev/null; then
              continue
            fi
            # The checkout is shallow, so fetch the single object by SHA rather
            # than deepening the whole clone.
            if git fetch --no-tags --depth=1 origin "$sha" 2>/dev/null &&
               git cat-file -e "$sha^{commit}" 2>/dev/null; then
              continue
            fi
            echo "::error file=.git-blame-ignore-revs::stale or unresolvable SHA: $sha"
            rc=1
          done < <(grep -vE '^[[:space:]]*(#|$)' .git-blame-ignore-revs)
          exit $rc
      # Core and ai-tutor-server typecheck against generated Prisma types, so
      # the clients have to exist before tsc runs. Linting does not need them.
      - name: Generate Prisma clients
        run: |
          npm run db:generate -w edu-ai
          ( cd apps/extensions/ai-tutor/server && npx prisma generate )
      # Warnings do not fail this job — the repo still carries roughly 900 of
      # them, and burning them down is the job of #1277, #1278 and #1279.
      # oxlint exits non-zero on errors, which is what gates here.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    # The aggregate job must always run so required checks stay present on
    # docs-only pull requests and still propagate upstream failures.
    if: always()
    needs: [changes, unit, prisma-isolation, lint]
    steps:
      - name: Preserve required-check result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          UNIT_RESULT: ${{ needs.unit.result }}
          PRISMA_RESULT: ${{ needs.prisma-isolation.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Affected-application detection failed or was cancelled."
            exit 1
          fi
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "Docs-only change; unit tests were not required."
            exit 0
          fi
          if [ "$UNIT_RESULT" != "success" ] || \
             { [ "$PRISMA_RESULT" != "success" ] && [ "$PRISMA_RESULT" != "skipped" ]; }; then
            echo "One or more unit-test jobs failed or were cancelled."
            exit 1
          fi
          if [ "$LINT_RESULT" != "success" ] && [ "$LINT_RESULT" != "skipped" ]; then
            echo "Lint or typecheck failed or was cancelled."
            exit 1
          fi

  e2e-run:
    name: E2E tests — affected stacks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Start timing
        run: echo "CI_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Select suites and images
        id: select
        env:
          CORE: ${{ needs.changes.outputs.core }}
          AI_TUTOR: ${{ needs.changes.outputs.ai_tutor }}
          QUESTION_MAKER: ${{ needs.changes.outputs.question_maker }}
          CROSS_SERVICE: ${{ needs.changes.outputs.cross_service }}
        run: |
          set -euo pipefail
          suites=()
          targets=(e2e-eduai-app e2e-runner)
          [ "$CORE" = true ] && suites+=(core)
          if [ "$AI_TUTOR" = true ]; then
            suites+=(ai-tutor)
            targets+=(e2e-ai-tutor-server e2e-ai-tutor-app)
          fi
          if [ "$QUESTION_MAKER" = true ]; then
            suites+=(question-maker)
            targets+=(e2e-qm-server e2e-qm-app)
          fi
          if [ "$CROSS_SERVICE" = true ]; then
            suites+=(cross-service)
            targets+=(
              e2e-ai-tutor-server e2e-ai-tutor-app
              e2e-qm-server e2e-qm-app
            )
          fi
          suites_csv=$(IFS=,; echo "${suites[*]}")
          targets_csv=$(printf '%s\n' "${targets[@]}" | awk '!seen[$0]++' | paste -sd, -)
          echo "suites=$suites_csv" >> "$GITHUB_OUTPUT"
          echo "targets=$targets_csv" >> "$GITHUB_OUTPUT"

      - name: Check runner disk space
        id: disk
        run: |
          set -euo pipefail
          available_kb=$(df --output=avail / | tail -1)
          cleanup=false
          # Keep cleanup as an exceptional path; it took 1–2 minutes on every prior run.
          if [ "$available_kb" -lt $((20 * 1024 * 1024)) ]; then
            cleanup=true
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
            docker system prune --all --force --volumes
          fi
          echo "cleanup=$cleanup" >> "$GITHUB_OUTPUT"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions runtime for BuildKit cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'true');

      - name: Build and load affected E2E images
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
        run: |
          set -euo pipefail
          : "${ACTIONS_RESULTS_URL:?GitHub Actions cache v2 URL is unavailable}"
          : "${ACTIONS_RUNTIME_TOKEN:?GitHub Actions cache token is unavailable}"
          args=()
          IFS=',' read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            args+=(
              --set "${target}.cache-from=type=gha,scope=${target},version=2,timeout=30s"
            )
          done
          docker buildx bake -f docker-compose.e2e.yml --load "${args[@]}" "${targets[@]}"

      - name: Run affected E2E suites
        env:
          E2E_SKIP_BUILD: "1"
          E2E_SUITES: ${{ steps.select.outputs.suites }}
        run: bash scripts/e2e-in-docker.sh

      - name: Warm affected E2E caches
        # Cache export is intentionally separate from the loaded test build:
        # exporting inline makes the critical path wait for a mode=max upload.
        continue-on-error: true
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
          GHA_CACHE_GH_TOKEN: ${{ github.token }}
          GHA_CACHE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            args+=(
              --set "${target}.cache-to=type=gha,scope=${target},version=2,mode=max,timeout=2m,ignore-error=true,repository=${GHA_CACHE_REPOSITORY},ghtoken=${GHA_CACHE_GH_TOKEN}"
            )
          done
          docker buildx bake -f docker-compose.e2e.yml "${args[@]}" "${targets[@]}"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Write timing summary
        if: always()
        run: |
          started_at=${CI_JOB_STARTED:-$(date +%s)}
          elapsed=$(($(date +%s) - started_at))
          {
            echo "### Affected E2E"
            echo
            echo "- Suites: \`${{ steps.select.outputs.suites }}\`"
            echo "- Images: \`${{ steps.select.outputs.targets }}\`"
            echo "- Conditional disk cleanup: \`${{ steps.disk.outputs.cleanup }}\`"
            echo "- Job time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Keep the required check present for docs-only pull requests while
    # propagating failures from classification and the affected E2E run.
    if: always()
    needs: [changes, e2e-run]
    steps:
      - name: Preserve required-check result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          E2E_RESULT: ${{ needs.e2e-run.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Affected-application detection failed or was cancelled."
            exit 1
          fi
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "Docs-only change; E2E was not required."
            exit 0
          fi
          if [ "$E2E_RESULT" != "success" ]; then
            echo "Affected E2E suites failed or were cancelled."
            exit 1
          fi

  visual:
    name: Diagram Visual Regression (Core)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        env:
          SKIP_PRISMA_GENERATE: "1"
        run: npm ci
      # #1422 review: nothing previously installed a browser for
      # `npm run test:visual` (apps/core/playwright.visual.config.ts), so a
      # clean checkout 404s/ENOENTs before any assertion runs. `npx playwright
      # install` reads the locked `@playwright/test` version from
      # package-lock.json, so this always matches the version the suite was
      # authored against.
      - name: Install locked Playwright Chromium
        working-directory: apps/core
        run: npx playwright install --with-deps chromium
      - name: Run diagram visual regression suite
        working-directory: apps/core
        run: npm run test:visual

  pict-drift:
    name: PICT Case Drift Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate PICT case tables
        run: npm run test:pict:gen
      - name: Fail if regeneration produced a diff
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- tests/models)" ]; then
            echo "::error::tests/models/*.cases.json is stale. Run 'npm run test:pict:gen' and commit the result."
            git status --porcelain -- tests/models
            git diff -- tests/models
            exit 1
          fi

  syncpack:
    name: Syncpack Version Drift Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Advisory only for now: land the check first and see how noisy it is against the
    # real repo before promoting it to a required/blocking status check.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syncpack lint
        run: npm run syncpack:check
