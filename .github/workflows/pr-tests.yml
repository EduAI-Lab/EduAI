name: PR Tests

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected applications
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      core: ${{ steps.filter.outputs.core }}
      ai_tutor: ${{ steps.filter.outputs.ai_tutor }}
      question_maker: ${{ steps.filter.outputs.question_maker }}
      shared: ${{ steps.filter.outputs.shared }}
      cross_service: ${{ steps.filter.outputs.cross_service }}
      unit_matrix: ${{ steps.filter.outputs.unit_matrix }}
    steps:
      - name: Classify changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename')
          else
            files="__all__"
          fi
          echo "$files"

          code=false
          core=false
          ai_tutor=false
          question_maker=false
          shared=false

          if [ "$files" = "__all__" ]; then
            code=true
            core=true
            ai_tutor=true
            question_maker=true
            shared=true
          elif echo "$files" | grep -qvE '\.(md|txt)$|^docs/|^LICENSE'; then
            code=true

            if echo "$files" | grep -qE '^apps/core/'; then
              core=true
            fi
            if echo "$files" | grep -qE '^apps/extensions/ai-tutor/'; then
              ai_tutor=true
            fi
            if echo "$files" | grep -qE '^apps/extensions/question-maker/'; then
              question_maker=true
            fi

            # Root build/test infrastructure and shared packages can affect every app.
            if echo "$files" | grep -qE \
              '^packages/|^tests/|^scripts/|^docker/|^docker-compose|^package(-lock)?\.json$|^turbo\.json$|^\.github/workflows/pr-tests\.yml$'; then
              shared=true
              core=true
              ai_tutor=true
              question_maker=true
            fi

            # Unknown code paths are treated conservatively as shared.
            if [ "$core" = false ] && [ "$ai_tutor" = false ] && \
               [ "$question_maker" = false ] && [ "$shared" = false ]; then
              shared=true
              core=true
              ai_tutor=true
              question_maker=true
            fi
          fi

          selected=0
          [ "$core" = true ] && selected=$((selected + 1))
          [ "$ai_tutor" = true ] && selected=$((selected + 1))
          [ "$question_maker" = true ] && selected=$((selected + 1))
          cross_service=false
          if [ "$shared" = true ] || [ "$core" = true ] || [ "$selected" -gt 1 ]; then
            cross_service=true
          fi

          {
            echo "code=$code"
            echo "core=$core"
            echo "ai_tutor=$ai_tutor"
            echo "question_maker=$question_maker"
            echo "shared=$shared"
            echo "cross_service=$cross_service"
          } >> "$GITHUB_OUTPUT"

          matrix='{"include":['
          separator=''
          if [ "$core" = true ]; then
            matrix+="${separator}"'{"scope":"core","label":"Core and shared UI","db_image":"pgvector/pgvector:pg16","db_user":"postgres","db_password":"postgres","db_name":"postgres"}'
            separator=','
          fi
          if [ "$ai_tutor" = true ]; then
            matrix+="${separator}"'{"scope":"ai_tutor","label":"AI Tutor","db_image":"postgres:16-alpine","db_user":"postgres","db_password":"postgres","db_name":"aitutor_test"}'
            separator=','
          fi
          if [ "$question_maker" = true ]; then
            matrix+="${separator}"'{"scope":"question_maker","label":"Question Maker","db_image":"postgres:15-alpine","db_user":"postgres","db_password":"password","db_name":"question_maker_test"}'
          fi
          matrix+=']}'
          echo "unit_matrix=$matrix" >> "$GITHUB_OUTPUT"

          {
            echo "### Affected applications"
            echo
            echo "| Core | AI Tutor | Question Maker | Cross-service |"
            echo "| --- | --- | --- | --- |"
            echo "| $core | $ai_tutor | $question_maker | $cross_service |"
          } >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: Unit tests — ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit_matrix) }}

    services:
      db:
        image: ${{ matrix.db_image }}
        env:
          POSTGRES_USER: ${{ matrix.db_user }}
          POSTGRES_PASSWORD: ${{ matrix.db_password }}
          POSTGRES_DB: ${{ matrix.db_name }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ matrix.db_user }}"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Start timing
        run: echo "CI_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        env:
          SKIP_PRISMA_GENERATE: "1"
        run: npm ci

      - name: Configure test environment
        run: |
          set -euo pipefail
          rm -f apps/core/.env
          cat > apps/core/.env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/eduai_test?schema=public"
          BETTER_AUTH_SECRET="test-secret-not-for-production"
          BETTER_AUTH_URL="http://localhost:3000"
          COOKIE_DOMAIN="localhost"
          PORT=4001
          EOF
          cat > apps/extensions/ai-tutor/server/.env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/aitutor_test"
          BETTER_AUTH_SECRET="test-secret-not-for-production"
          BETTER_AUTH_URL="http://localhost:4000/api/auth"
          COOKIE_DOMAIN="localhost"
          PORT=4001
          EOF

      - name: Generate Prisma client
        run: |
          set -euo pipefail
          case "${{ matrix.scope }}" in
            core)
              npm run db:generate -w edu-ai
              ;;
            ai_tutor)
              ( cd apps/extensions/ai-tutor/server && npx prisma generate )
              ;;
            question_maker)
              npm run db:generate -w question-maker-backend
              ;;
          esac

      - name: Typecheck Core
        if: matrix.scope == 'core'
        run: npm run typecheck -w edu-ai

      - name: Restore Turborepo cache
        id: turbo-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ matrix.scope }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ matrix.scope }}-

      - name: Run workspace tests
        env:
          NODE_ENV: test
          GOOGLE_GENERATIVE_AI_API_KEY: test-key-not-real
          TEST_DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/question_maker_test
          JWT_SECRET: test-jwt-secret-for-ci
          ENCRYPTION_KEY: test-encryption-key-32bytes!!
        run: |
          case "${{ matrix.scope }}" in
            core)
              status=0
              npx turbo run test --continue --env-mode=loose \
                --filter=@eduai/ui &
              ui_pid=$!
              npx turbo run test:unit test:integration --continue --env-mode=loose \
                --filter=edu-ai &
              core_pid=$!
              wait "$ui_pid" || status=1
              wait "$core_pid" || status=1
              exit "$status"
              ;;
            ai_tutor)
              npx turbo run test --continue --env-mode=loose \
                --filter=ai-tutor --filter=ai-tutor-server
              ;;
            question_maker)
              npx turbo run test --continue --env-mode=loose \
                --filter=question-maker-frontend --filter=question-maker-backend
              ;;
          esac

      - name: Save Turborepo cache
        if: success() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

      - name: Write timing summary
        if: always()
        run: |
          elapsed=$(($(date +%s) - CI_JOB_STARTED))
          matched='${{ steps.turbo-cache.outputs.cache-matched-key }}'
          [ -n "$matched" ] || matched='none'
          {
            echo "### ${{ matrix.label }}"
            echo
            echo "- Job time: ${elapsed}s"
            echo "- Turbo cache matched: \`$matched\`"
            echo "- Exact cache hit: \`${{ steps.turbo-cache.outputs.cache-hit || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  prisma-isolation:
    name: Prisma Client Isolation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        env:
          SKIP_PRISMA_GENERATE: "1"
        run: npm ci
      - name: Generate each client once
        run: |
          npm run db:generate -w edu-ai
          ( cd apps/extensions/ai-tutor/server && npx prisma generate )
          npm run db:generate -w question-maker-backend
      - run: npm run test:prisma-client-isolation

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, unit, prisma-isolation]
    steps:
      - name: Preserve required-check result
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          UNIT_RESULT: ${{ needs.unit.result }}
          PRISMA_RESULT: ${{ needs.prisma-isolation.result }}
        run: |
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "Docs-only change; unit tests were not required."
            exit 0
          fi
          if [ "$UNIT_RESULT" != "success" ] || \
             { [ "$PRISMA_RESULT" != "success" ] && [ "$PRISMA_RESULT" != "skipped" ]; }; then
            echo "One or more unit-test jobs failed or were cancelled."
            exit 1
          fi

  e2e-run:
    name: E2E tests — affected stacks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Start timing
        run: echo "CI_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Select suites and images
        id: select
        env:
          CORE: ${{ needs.changes.outputs.core }}
          AI_TUTOR: ${{ needs.changes.outputs.ai_tutor }}
          QUESTION_MAKER: ${{ needs.changes.outputs.question_maker }}
          CROSS_SERVICE: ${{ needs.changes.outputs.cross_service }}
        run: |
          set -euo pipefail
          suites=()
          targets=(e2e-eduai-app e2e-runner)
          [ "$CORE" = true ] && suites+=(core)
          if [ "$AI_TUTOR" = true ]; then
            suites+=(ai-tutor)
            targets+=(e2e-ai-tutor-server e2e-ai-tutor-app)
          fi
          if [ "$QUESTION_MAKER" = true ]; then
            suites+=(question-maker)
            targets+=(e2e-qm-server e2e-qm-app)
          fi
          if [ "$CROSS_SERVICE" = true ]; then
            suites+=(cross-service)
            targets+=(
              e2e-ai-tutor-server e2e-ai-tutor-app
              e2e-qm-server e2e-qm-app
            )
          fi
          suites_csv=$(IFS=,; echo "${suites[*]}")
          targets_csv=$(printf '%s\n' "${targets[@]}" | awk '!seen[$0]++' | paste -sd, -)
          echo "suites=$suites_csv" >> "$GITHUB_OUTPUT"
          echo "targets=$targets_csv" >> "$GITHUB_OUTPUT"

      - name: Check runner disk space
        id: disk
        run: |
          set -euo pipefail
          available_kb=$(df --output=avail / | tail -1)
          cleanup=false
          # Keep cleanup as an exceptional path; it took 1–2 minutes on every prior run.
          if [ "$available_kb" -lt $((20 * 1024 * 1024)) ]; then
            cleanup=true
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
            docker system prune --all --force --volumes
          fi
          echo "cleanup=$cleanup" >> "$GITHUB_OUTPUT"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions runtime for BuildKit cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'true');

      - name: Build and load affected E2E images
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
        run: |
          set -euo pipefail
          : "${ACTIONS_RESULTS_URL:?GitHub Actions cache v2 URL is unavailable}"
          : "${ACTIONS_RUNTIME_TOKEN:?GitHub Actions cache token is unavailable}"
          args=()
          IFS=',' read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            args+=(
              --set "${target}.cache-from=type=gha,scope=${target},version=2,timeout=30s"
            )
          done
          docker buildx bake -f docker-compose.e2e.yml --load "${args[@]}" "${targets[@]}"

      - name: Run affected E2E suites
        env:
          E2E_SKIP_BUILD: "1"
          E2E_SUITES: ${{ steps.select.outputs.suites }}
        run: bash scripts/e2e-in-docker.sh

      - name: Warm affected E2E caches
        continue-on-error: true
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
          GHA_CACHE_GH_TOKEN: ${{ github.token }}
          GHA_CACHE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            args+=(
              --set "${target}.cache-to=type=gha,scope=${target},version=2,mode=max,timeout=2m,ignore-error=true,repository=${GHA_CACHE_REPOSITORY},ghtoken=${GHA_CACHE_GH_TOKEN}"
            )
          done
          docker buildx bake -f docker-compose.e2e.yml "${args[@]}" "${targets[@]}"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Write timing summary
        if: always()
        run: |
          elapsed=$(($(date +%s) - CI_JOB_STARTED))
          {
            echo "### Affected E2E"
            echo
            echo "- Suites: \`${{ steps.select.outputs.suites }}\`"
            echo "- Images: \`${{ steps.select.outputs.targets }}\`"
            echo "- Conditional disk cleanup: \`${{ steps.disk.outputs.cleanup }}\`"
            echo "- Job time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, e2e-run]
    steps:
      - name: Preserve required-check result
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          E2E_RESULT: ${{ needs.e2e-run.result }}
        run: |
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "Docs-only change; E2E was not required."
            exit 0
          fi
          if [ "$E2E_RESULT" != "success" ]; then
            echo "Affected E2E suites failed or were cancelled."
            exit 1
          fi

  pict-drift:
    name: PICT Case Drift Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate PICT case tables
        run: npm run test:pict:gen
      - name: Fail if regeneration produced a diff
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- tests/models)" ]; then
            echo "::error::tests/models/*.cases.json is stale. Run 'npm run test:pict:gen' and commit the result."
            git status --porcelain -- tests/models
            git diff -- tests/models
            exit 1
          fi
