name: PR Tests

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Docker test suite
        run: npm run test:all
