name: CI Tests

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54321:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54321/eduai_ci
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54321/question_maker_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create CI databases
        run: |
          PGPASSWORD=postgres psql -h localhost -p 54321 -U postgres -c "CREATE DATABASE eduai_ci;"
          PGPASSWORD=postgres psql -h localhost -p 54321 -U postgres -c "CREATE DATABASE question_maker_test;"

      - name: Run all tests
        run: npm run test