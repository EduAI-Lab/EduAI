name: EduAI Task
description: Create a tracked EduAI implementation, documentation, research, or maintenance task.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for every EduAI work item.

        **The title is a plain description of the work.** Do not put a size, a week
        number, or any other metadata in it — those live in board fields, where they
        can be filtered and cannot go stale. See
        [`docs/ISSUE-CONVENTIONS.md`](https://github.com/EduAI-Lab/EduAI/blob/main/docs/ISSUE-CONVENTIONS.md).

        Size guide:
        - `S` = 0 to 4 hours
        - `M` = 4 to 8 hours
        - `L` = 8 to 16 hours

        Split the issue if the task exceeds 16 hours.

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Estimated effort. Transcribed to the board's Size field, which is the source of truth.
      options:
        - S - 0 to 4 hours
        - M - 4 to 8 hours
        - L - 8 to 16 hours
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Briefly explain what needs to be done and why.
      placeholder: "Implement X so that Y can happen."
    validations:
      required: true

  - type: textarea
    id: hours
    attributes:
      label: Hours to complete
      description: |
        Required for every issue.

        Use one line per contributor per week.

        Exact required format:
        Hours to complete (Week N): X hours [github-handle]

        Single-week example:
        Hours to complete (Week 1): 3 hours [Whiteknight07]
        Hours to complete (Week 1): 4 hours [evanbones]

        Multi-week example:
        Hours to complete (Week 1): 3 hours [Whiteknight07]
        Hours to complete (Week 1): 4 hours [evanbones]
        Hours to complete (Week 2): 2 hours [Whiteknight07]

        Do not use plain names. Use bracketed GitHub handles only.
      placeholder: |
        Hours to complete (Week 1): 3 hours [Whiteknight07]
        Hours to complete (Week 1): 4 hours [evanbones]
        Hours to complete (Week 2): 2 hours [Whiteknight07]
    validations:
      required: true

  - type: input
    id: epic
    attributes:
      label: Epic link
      description: Every issue must link to a parent epic.
      placeholder: "EPIC: https://github.com/EduAI-Lab/EduAI/issues/123"
    validations:
      required: true

  - type: input
    id: parent_issue
    attributes:
      label: Parent issue, if applicable
      description: Add the parent issue or sprint issue if this task belongs to one.
      placeholder: "Parent Issue: #340"

  - type: checkboxes
    id: setup
    attributes:
      label: Required setup
      description: Complete these after creating the issue.
      options:
        - label: I will assign everyone working on this issue.
          required: true
        - label: I will set Size, Priority and Iteration on the Edu AI Core board.
          required: true
        - label: I confirm this issue is linked to an epic.
          required: true
        - label: "I used one hours line per week per contributor in the format `Hours to complete (Week N): X hours [github-handle]`."
          required: true
