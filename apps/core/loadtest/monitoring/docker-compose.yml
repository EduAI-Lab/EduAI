name: eduai-loadtest-monitoring

# Local-only k6 + Grafana observability stack for issue #919. No cloud
# account, no external service — everything runs on localhost.
#
#   npm run loadtest:monitoring:up
#   k6 run --out influxdb=http://localhost:8086/k6 loadtest/k6/stress-500.js
#   open http://localhost:3300  (admin / admin, dashboard auto-provisioned)
#   npm run loadtest:monitoring:down

services:
  influxdb:
    image: influxdb:1.11
    container_name: eduai-loadtest-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_LOG_ENABLED: "false"
    volumes:
      - eduai-loadtest-influxdb-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:11.3.0
    container_name: eduai-loadtest-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning

volumes:
  eduai-loadtest-influxdb-data:
