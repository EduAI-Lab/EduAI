services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: eduquery-postgres
    environment:
      POSTGRES_DB: eduquery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PRODUCTION:?POSTGRES_PASSWORD_PRODUCTION must be set}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Resource limits to prevent OOM kills
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API
  backend:
    build:
      context: ../../..
      dockerfile: apps/extensions/question-maker/app/backend/Dockerfile
    container_name: eduquery-backend
    env_file:
      - .env
    environment:
      # The image inserts and URL-encodes the raw password before startup.
      DATABASE_URL: postgresql://postgres@postgres:5432/eduquery
      LOG_LEVEL: warn
      NODE_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PRODUCTION:?POSTGRES_PASSWORD_PRODUCTION must be set}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Resource limits to prevent memory leaks from crashing the system
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend
  frontend:
    build:
      context: ../../..
      dockerfile: apps/extensions/question-maker/app/frontend/Dockerfile
      args:
        # Vite reads these only while building; runtime env_file values cannot
        # change an already-compiled browser bundle.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_CORE_URL: ${VITE_CORE_URL:-https://eduai.ok.ubc.ca}
        VITE_AI_TUTOR_URL: ${VITE_AI_TUTOR_URL:-https://ai-tutor.eduai.ok.ubc.ca}
        VITE_QUESTION_MAKER_URL: ${VITE_QUESTION_MAKER_URL:-https://qm.eduai.ok.ubc.ca}
        VITE_CANVAS_TEST_MODE: ${VITE_CANVAS_TEST_MODE:-false}
    container_name: eduquery-frontend
    ports:
      - "3005:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  default:
    name: eduquery-network
