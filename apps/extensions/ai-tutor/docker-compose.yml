services:
  db:
    image: postgres:16-alpine
    container_name: aitutor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a non-default secret}
      POSTGRES_DB: aitutor
    ports:
      # The backend runs under PM2 on the host, so it needs a host socket. Bind
      # only to loopback: PostgreSQL must never be reachable from the network.
      - '127.0.0.1:54321:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
