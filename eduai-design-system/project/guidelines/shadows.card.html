<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows" subtitle="Six-step elevation scale — intentionally soft, border-first" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 24px; font-family: var(--font-sans); background: var(--color-neutral-50); display: flex; gap: 14px; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 72px; height: 52px; background: var(--color-neutral-0); border-radius: var(--radius-base); border: 1px solid var(--border); }
  .label { font-size: 10px; font-family: var(--font-mono); color: var(--muted-foreground); text-align: center; }
</style>
</head>
<body>
  <div class="cell"><div class="box" style="box-shadow:none; border:1px solid var(--border)"></div><div class="label">none<br>(border only)</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-2xs)"></div><div class="label">--shadow-2xs</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="label">--shadow-xs</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="label">--shadow-sm</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="label">--shadow-md</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="label">--shadow-lg</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="label">--shadow-xl</div></div>
</body>
</html>
