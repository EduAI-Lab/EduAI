<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-sans); background: var(--background); }
  .section { margin-bottom: 20px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .caption { font-size: 11px; color: var(--muted-foreground); font-family: var(--font-mono); margin-bottom: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Avatar, Tabs } = window.EduAIDesignSystem_4b4b4d;

function App() {
  return (
    <div>
      <div className="section">
        <div className="caption">Avatar — sizes (rounded)</div>
        <div className="row">
          <Avatar name="Alex Chen" size="xs" />
          <Avatar name="Jordan Park" size="sm" />
          <Avatar name="Sam Rivera" size="default" />
          <Avatar name="Casey Liu" size="lg" />
          <Avatar name="Morgan Wu" size="xl" />
          <Avatar name="Riley Kim" size="default" shape="circle" />
          <Avatar name="Taylor Brown" size="default" shape="square" />
        </div>
      </div>
      <hr className="divider" />
      <div className="section">
        <div className="caption">Tabs — course detail pattern</div>
        <Tabs
          defaultTab="overview"
          tabs={[
            { id: "overview",    label: "Overview",    content: <div style={{fontSize:"13px",color:"var(--muted-foreground)"}}>Course overview content</div> },
            { id: "materials",   label: "Materials",   badge: 12 },
            { id: "topics",      label: "Topics",      badge: 4 },
            { id: "enrollments", label: "Enrollments", badge: 89 },
            { id: "staff",       label: "Staff" },
            { id: "embedding",   label: "Embedding",   disabled: true },
          ]}
        />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
