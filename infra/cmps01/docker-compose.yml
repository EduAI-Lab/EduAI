# cmps01 public :8001 — nginx edge routes vLLM + research energy (single firewall port).
# LiteLLM listens on 127.0.0.1:18091 only; nginx binds :8001.
# vLLM backends are started separately (see README.md).

services:
  eduai-vllm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: eduai-vllm-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      # Rendered by deploy-edge-proxy.sh from litellm-config.yaml.template (#1115).
      - ./litellm-config.runtime.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "18091", "--host", "127.0.0.1"]

  eduai-edge-proxy:
    image: nginx:1.27-alpine
    container_name: eduai-edge-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./internal-allow.conf:/etc/nginx/conf.d/internal-allow.conf:ro
    depends_on:
      - eduai-vllm-proxy
