# EduAI AI Tutor — DEV on s378. Frontend :3001, API :4000.
# Uses shared s378 SSL cert (SAN includes dev.aitutor.eduai.ok.ubc.ca).

<VirtualHost *:80>
    ServerName dev.aitutor.eduai.ok.ubc.ca
    Redirect / https://dev.aitutor.eduai.ok.ubc.ca/
</VirtualHost>

<VirtualHost *:443>
    ServerName dev.aitutor.eduai.ok.ubc.ca

    SSLEngine on

    ProxyPreserveHost On
    ProxyTimeout 300

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://localhost:3001/ [P,L]

    ProxyPass        /api/ http://localhost:4000/api/
    ProxyPassReverse /api/ http://localhost:4000/api/

    ProxyPass        / http://localhost:3001/
    ProxyPassReverse / http://localhost:3001/
</VirtualHost>
