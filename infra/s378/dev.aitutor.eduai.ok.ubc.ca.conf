# EduAI AI Tutor — DEV on s378. Static build served by Apache, API :4000.
# Uses shared s378 SSL cert (SAN includes dev.aitutor.eduai.ok.ubc.ca).
#
# The app is ssr:false, so `npm run build` emits plain static files and Apache
# serves them directly — there is no Vite process on :3001 any more. Rebuild with
# infra/s378/go-live-build.sh; a `git pull` alone no longer changes what is served.

<VirtualHost *:80>
    ServerName dev.aitutor.eduai.ok.ubc.ca
    Redirect / https://dev.aitutor.eduai.ok.ubc.ca/
</VirtualHost>

<VirtualHost *:443>
    ServerName dev.aitutor.eduai.ok.ubc.ca

    SSLEngine on

    ProxyPreserveHost On
    ProxyTimeout 300

    # API first: these must be evaluated before the static DocumentRoot so
    # FallbackResource can never swallow an API call and hand back index.html.
    ProxyPass        /api/ http://localhost:4000/api/
    ProxyPassReverse /api/ http://localhost:4000/api/

    # Everything else is served from disk, not proxied.
    ProxyPass / !

    DocumentRoot /srv/www/dev.eduai.ok.ubc.ca/EduAICore/EduAICore/apps/extensions/ai-tutor/build/client

    <Directory /srv/www/dev.eduai.ok.ubc.ca/EduAICore/EduAICore/apps/extensions/ai-tutor/build/client>
        Require all granted
        Options -Indexes +FollowSymLinks
        # Client-side routing: deep links like /instructor/module/42 have no file
        # on disk and must render the SPA shell. Mirrors public/_redirects.
        FallbackResource /index.html
    </Directory>

    # Without this a stale asset URL would hit FallbackResource, return index.html
    # with a 200, and white-screen the app with "Unexpected token '<'". Let missing
    # assets 404 honestly instead.
    <LocationMatch "\.(js|mjs|css|map|woff2?|ttf|png|jpe?g|svg|webp|ico)$">
        FallbackResource disabled
    </LocationMatch>

    # Asset filenames are content-hashed, so they are safe to cache forever.
    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # The shell is not hashed and must never be cached, or a rebuild keeps
    # serving references to deleted asset files.
    <LocationMatch "^/(index\.html)?$">
        Header always set Cache-Control "no-store"
    </LocationMatch>
</VirtualHost>
