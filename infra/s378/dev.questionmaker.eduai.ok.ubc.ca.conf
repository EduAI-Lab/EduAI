# EduAI Question Maker — DEV on s378. Static build served by Apache, backend :8000.
# Uses shared s378 SSL cert (SAN includes dev.questionmaker.eduai.ok.ubc.ca).
#
# The frontend is a plain Vite SPA, so `npm run build` emits static files that
# Apache serves directly — there is no Vite process on :5173 any more. Rebuild
# with infra/s378/go-live-build.sh; a `git pull` alone no longer changes what is
# served.

<VirtualHost *:80>
    ServerName dev.questionmaker.eduai.ok.ubc.ca
    Redirect / https://dev.questionmaker.eduai.ok.ubc.ca/
</VirtualHost>

<VirtualHost *:443>
    ServerName dev.questionmaker.eduai.ok.ubc.ca

    SSLEngine on

    ProxyPreserveHost On
    ProxyTimeout 300

    # API first: these must be evaluated before the static DocumentRoot so
    # FallbackResource can never swallow an API call and hand back index.html.
    ProxyPass        /api/ http://localhost:8000/api/
    ProxyPassReverse /api/ http://localhost:8000/api/

    # Everything else is served from disk, not proxied.
    ProxyPass / !

    DocumentRoot /srv/www/dev.eduai.ok.ubc.ca/EduAICore/EduAICore/apps/extensions/question-maker/app/frontend/dist

    <Directory /srv/www/dev.eduai.ok.ubc.ca/EduAICore/EduAICore/apps/extensions/question-maker/app/frontend/dist>
        Require all granted
        Options -Indexes +FollowSymLinks
        # Client-side routing: deep links have no file on disk and must render
        # the SPA shell.
        FallbackResource /index.html
    </Directory>

    # Without this a stale asset URL would hit FallbackResource, return index.html
    # with a 200, and white-screen the app with "Unexpected token '<'". Let missing
    # assets 404 honestly instead.
    <LocationMatch "\.(js|mjs|css|map|woff2?|ttf|png|jpe?g|svg|webp|ico)$">
        FallbackResource disabled
    </LocationMatch>

    # Asset filenames are content-hashed, so they are safe to cache forever.
    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # The shell is not hashed and must never be cached, or a rebuild keeps
    # serving references to deleted asset files.
    <LocationMatch "^/(index\.html)?$">
        Header always set Cache-Control "no-store"
    </LocationMatch>
</VirtualHost>
