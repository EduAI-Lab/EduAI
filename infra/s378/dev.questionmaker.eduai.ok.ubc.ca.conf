# EduAI Question Maker — DEV on s378. Frontend :5173, backend :8000.
# Uses shared s378 SSL cert (SAN includes dev.questionmaker.eduai.ok.ubc.ca).

<VirtualHost *:80>
    ServerName dev.questionmaker.eduai.ok.ubc.ca
    Redirect / https://dev.questionmaker.eduai.ok.ubc.ca/
</VirtualHost>

<VirtualHost *:443>
    ServerName dev.questionmaker.eduai.ok.ubc.ca

    SSLEngine on

    ProxyPreserveHost On
    ProxyTimeout 300

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://localhost:5173/ [P,L]

    ProxyPass        /api/ http://localhost:8000/api/
    ProxyPassReverse /api/ http://localhost:8000/api/

    ProxyPass        / http://localhost:5173/
    ProxyPassReverse / http://localhost:5173/
</VirtualHost>
