# EduAI Question Maker production reverse proxy.
# Confirm the institutionally managed certificate already covers this
# hostname (shared with aitutor.eduai.ok.ubc.ca / my.eduai.ok.ubc.ca) before
# enabling this vhost — mod_ssl inherits the default/global cert directives
# already configured on this host for the *.eduai.ok.ubc.ca names, so no
# SSLCertificateFile/SSLCertificateKeyFile directives are added here; add
# them only if this hostname turns out not to be covered by that config.

<VirtualHost *:80>
    ServerName questionmaker.eduai.ok.ubc.ca
    Redirect permanent / https://questionmaker.eduai.ok.ubc.ca/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName questionmaker.eduai.ok.ubc.ca

    SSLEngine on
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 300

    # API must be evaluated before the static fallback.
    ProxyPass        /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/
    ProxyPass / !

    DocumentRoot /srv/www/eduai-production/current/apps/extensions/question-maker/app/frontend/dist

    <Directory /srv/www/eduai-production/current/apps/extensions/question-maker/app/frontend/dist>
        Require all granted
        Options -Indexes +FollowSymLinks
        FallbackResource /index.html
    </Directory>

    <LocationMatch "\.(js|mjs|css|map|woff2?|ttf|png|jpe?g|svg|webp|ico)$">
        FallbackResource disabled
    </LocationMatch>

    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <LocationMatch "^/(index\.html)?$">
        Header always set Cache-Control "no-store"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/eduai-qm-error.log
    CustomLog ${APACHE_LOG_DIR}/eduai-qm-access.log combined
</VirtualHost>
</IfModule>
