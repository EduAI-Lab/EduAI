# EduAI Core production reverse proxy.
# Review Apache module/TLS policy with IT before installation.

<VirtualHost *:80>
    ServerName my.eduai.ok.ubc.ca
    Redirect permanent / https://my.eduai.ok.ubc.ca/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName my.eduai.ok.ubc.ca

    SSLEngine on
    # Set these paths to the institutionally managed certificate files.
    SSLCertificateFile /etc/ssl/certs/my.eduai.ok.ubc.ca/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/my.eduai.ok.ubc.ca/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/eduai-core-error.log
    CustomLog ${APACHE_LOG_DIR}/eduai-core-access.log combined
</VirtualHost>
</IfModule>
