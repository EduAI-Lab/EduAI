# EduAI Question Maker production reverse proxy.

<VirtualHost *:80>
    ServerName questionmaker.ok.ubc.ca
    Redirect permanent / https://questionmaker.ok.ubc.ca/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName questionmaker.ok.ubc.ca

    SSLEngine on
    # Replace these placeholders with the institution-managed certificate
    # paths (or an approved wildcard certificate) before enabling this vhost.
    SSLCertificateFile /etc/ssl/certs/questionmaker.ok.ubc.ca/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/questionmaker.ok.ubc.ca/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 300

    # API must be evaluated before the frontend fallback.
    ProxyPass        /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/
    ProxyPass        / http://127.0.0.1:3005/
    ProxyPassReverse / http://127.0.0.1:3005/

    ErrorLog ${APACHE_LOG_DIR}/eduai-questionmaker-error.log
    CustomLog ${APACHE_LOG_DIR}/eduai-questionmaker-access.log combined
</VirtualHost>
</IfModule>
