# infra/cron/logrotate.conf
# Install on the production server:
#   sudo cp infra/cron/logrotate.conf /etc/logrotate.d/eduai-cron
#
# Retains 3 years of daily audit logs to satisfy UBC Policy #117.

/var/log/eduai/data-lifecycle.log {
    daily
    rotate 1095
    compress
    delaycompress
    missingok
    notifempty
    create 640 eduai-cron adm
}
