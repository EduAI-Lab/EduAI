# LiteLLM router — Qwen3.5-4B + Qwen3.5-27B-FP8 (one model per GPU).
# Used by migrate.sh. Replaces the Qwen2.5 7B+32B stack.
model_list:
  - model_name: qwen3.5-4b-instruct
    litellm_params:
      model: openai/qwen3.5-4b-instruct
      api_base: http://127.0.0.1:18001/v1
      api_key: vllm-local
  - model_name: qwen3.5-27b-instruct
    litellm_params:
      model: openai/qwen3.5-27b-instruct
      api_base: http://127.0.0.1:18002/v1
      api_key: vllm-local
general_settings:
  master_key: vllm-local
