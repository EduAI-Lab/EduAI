# cmps03 public :8001 edge. The vLLM backend is started by deploy.sh.
services:
  eduai-vllm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: eduai-vllm-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "18091", "--host", "127.0.0.1"]

  eduai-edge-proxy:
    image: nginx:1.27-alpine
    container_name: eduai-edge-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - eduai-vllm-proxy

