# Git hooks for the EduAI monorepo.
#
# Installed automatically by the root `prepare` script on `npm install`.
# To run a hook by hand:      npx lefthook run pre-commit
# To skip hooks for a commit: git commit --no-verify
#
# Only staged files are checked, so hook time stays proportional to the
# change rather than to the repo. The repo has been swept with `oxfmt --write`
# (#1512), so formatting is enforced here as well as in CI — catching drift at
# commit time is cheaper than catching it after a push.

pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      run: npx oxfmt --check {staged_files}
    - name: oxlint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      # --quiet reports errors only. The repo still carries ~900 warnings, and
      # printing them on every commit would bury the errors that actually block.
      run: npx oxlint --quiet {staged_files}
